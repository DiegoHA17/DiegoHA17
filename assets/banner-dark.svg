<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Diego Herrera Ayuso</title>
  <desc id="d">Developer in training building web, desktop and mobile apps.</desc>
  <defs>
    <linearGradient id="bgfade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11151f"/>
      <stop offset="1" stop-color="#151a26"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#1f2533"/>
    </pattern>
    <linearGradient id="dotsfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.35" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="dotsmask"><rect width="1200" height="300" fill="url(#dotsfade)"/></mask>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="298" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
